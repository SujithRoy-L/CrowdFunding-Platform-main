# Server Configuration
server.port=${PORT:5000}

# MySQL Database Configuration
spring.datasource.url=${MYSQL_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crowdfunding?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:Sujith@2005}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secrets & Configurations
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5f8c2b6d0e3f7a1b5c8d2f6g0h3j7k1l5m8n2p6q0r3s7t1u5v}
# 30 Days in Milliseconds
jwt.expiration=2592000000

# Logging Options
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

